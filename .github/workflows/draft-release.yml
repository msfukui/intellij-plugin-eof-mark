name: Draft Release

# main への push ごとに次バージョンの draft release を作り直す。
# タグは作られず、GitHub 上で release を publish した時点で Release ワークフローが動く。
on:
  push:
    branches: [ main ]
    # paths-ignore は設定しない。label-check.yml が全 PR にリリースラベルを要求する
    # ため、Markdown だけの変更もリリース対象になる。除外すると「ラベルはあるのに
    # draft が更新されない」状態になる。

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      # git push は行わないため資格情報を .git/config に残さない。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get latest release tag
        id: latest_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # タグ以降のコミットに紐づく PR を API で解決する。
      #
      # 以前は mergedAt とタグのコミット時刻を比較していたが、タグが指すマージコミットの
      # committer 時刻より PR の mergedAt が 1 秒後になるため、そのリリースに含まれた
      # 最後の PR を再収集し、中身が空の draft が作られていた（#81）。
      #
      # コミットの到達可能性で判定すれば時刻のずれに影響されない。マージ方法
      # （merge / squash / rebase）にも依存しない。バージョンコミットは PR に
      # 紐づかないため自然に除外される。
      - name: Collect merged PRs since last release
        id: collect_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest_tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$TAG" ]; then
            RANGE="${TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          NUMBERS=$(git log --format=%H "$RANGE" | while read -r sha; do
            gh api "repos/${REPO}/commits/${sha}/pulls" --jq '.[].number' 2>/dev/null || true
          done | sort -un)

          if [ -z "$NUMBERS" ]; then
            PRS="[]"
          else
            PRS=$(for n in $NUMBERS; do
              gh api "repos/${REPO}/pulls/${n}" --jq '{number: .number, labels: [.labels[] | {name: .name}]}'
            done | jq -s '.')
          fi

          echo "Collected PRs: $(echo "$PRS" | jq -c 'map(.number)')"
          {
            echo "prs<<EOF"
            echo "$PRS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine version bump level
        id: bump_level
        env:
          # ラベル名は利用者が付けた文字列なので、run へ直接展開せず env 経由で渡す。
          PRS: ${{ steps.collect_prs.outputs.prs }}
        run: |
          HAS_MAJOR=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:major")')
          HAS_MINOR=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:minor")')
          HAS_PATCH=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:patch")')

          if [ "$HAS_MAJOR" = "true" ]; then
            LEVEL="major"
          elif [ "$HAS_MINOR" = "true" ]; then
            LEVEL="minor"
          elif [ "$HAS_PATCH" = "true" ]; then
            LEVEL="patch"
          else
            # リリース直後のバージョンコミットや、ラベル対象外の直接 push で到達する。
            # draft を作る理由がないだけなので、失敗させずスキップする。
            echo "No PRs with release labels since last release. Skipping."
            echo "level=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next_version
        if: steps.bump_level.outputs.level != ''
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
          LEVEL: ${{ steps.bump_level.outputs.level }}
        run: |
          # 直近のタグを基準にする。draft のタグ名がバージョンの正であり、
          # gradle.properties は publish 時に追随させる。
          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
          else
            CURRENT=$(grep '^pluginVersion' gradle.properties | sed 's/.*= *//')
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$LEVEL" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (bump: $LEVEL, from: $CURRENT)"

      - name: Recreate draft release
        if: steps.bump_level.outputs.level != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          # 既存の draft をすべて削除してから作り直す。前回リリース以降の PR と
          # ラベルを常に正しく反映させるため、状態を持たない方針とする。
          gh release list --limit 50 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | while read -r d; do
            echo "Deleting existing draft: $d"
            gh release delete "$d" --yes
          done

          gh release create "$TAG" \
            --draft \
            --target main \
            --title "$TAG" \
            --generate-notes
          echo "Created draft release $TAG"
