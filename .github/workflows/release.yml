name: Release

# GitHub 上で release を publish すると動く。draft は Draft Release ワークフローが作る。
# 公開だけをやり直したい場合は workflow_dispatch に既存のタグを渡す。
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: '公開し直す release のタグ (例: v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: target
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag could not be determined."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $TAG (version ${TAG#v})"

      # main ではなく対象タグを checkout する。workflow_dispatch で過去タグの公開を
      # やり直す際に、main の最新コードで成果物を作ってしまうのを避けるため。
      #
      # persist-credentials: false にはできない。後段の Commit version update to main で
      # git push origin main を行うため資格情報が必要。本ワークフローが upload する
      # アーティファクトは build/reports/pluginVerifier/ のみで .git を含まないため、
      # artipacked が想定する「アーティファクト経由での資格情報漏洩」は起きない。
      - name: Checkout release tag # zizmor: ignore[artipacked]
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # タグが指すコミットの gradle.properties は前バージョンのままなので、
      # ビルド用に対象バージョンへ書き換える（この時点ではコミットしない）。
      - name: Set version for build
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" gradle.properties
          grep '^pluginVersion' gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # リリース成果物を作るため、キャッシュ汚染が配布物に混入する経路を断つ。
      # PR のビルドが書き込んだキャッシュを信頼しない。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - name: Get release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          # release 本文をシェルへ直接展開するとスクリプトインジェクションになるため、
          # gh 経由で取得する。
          MARKDOWN=$(gh release view "$TAG" --json body -q .body)
          # plugin.xml の <change-notes> は HTML として解釈されるため、
          # GitHub が生成した Markdown を HTML に変換する。
          # mode=gfm は hovercard 等の GitHub 固有属性が大量に付くため mode=markdown を使い、
          # 見出しに付与されるアンカー装飾と class 属性を取り除いて素の HTML にする。
          NOTES=$(gh api /markdown -f text="$MARKDOWN" -f mode=markdown \
            | sed -E 's|<div class="markdown-heading"><h([1-6])[^>]*>(.*)</h[1-6]><a id="user-content-[^"]*"[^>]*>.*</a></div>|<h\1>\2</h\1>|g')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # change notes が確定しているため、ビルドは 1 回で足りる。
      - name: Build plugin
        run: ./gradlew buildPlugin
        env:
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}

      - name: Verify artifact
        id: artifact
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          ZIP="build/distributions/intellij-plugin-eof-mark-${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected artifact not found: $ZIP"
            ls -la build/distributions/ || true
            exit 1
          fi
          echo "artifact=$ZIP" >> "$GITHUB_OUTPUT"

      # main への push と公開より前に実行する。失敗しても副作用が残らないようにするため。
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

      # ここまではタグを detached HEAD で checkout しているため、そのまま commit しても
      # ローカルの main ref は動かず push が空振りする。明示的に main へ切り替えてから
      # バージョンを再適用する。build/ は gitignore 済みなので成果物は失われない。
      - name: Commit version update to main
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B main origin/main

          sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" gradle.properties
          git add gradle.properties
          # 公開のみをやり直す場合は既にコミット済みなので、差分が無ければ何もしない。
          if git diff --cached --quiet; then
            echo "gradle.properties on main is already ${VERSION}."
          else
            git commit -m "Bump version to ${VERSION}"
            git push origin main
          fi

      - name: Attach artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        run: |
          gh release upload "$TAG" "$ARTIFACT" --clobber

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}
