name: Release

# GitHub 上で release を publish すると動く。draft は Draft Release ワークフローが作る。
# 公開だけをやり直したい場合は workflow_dispatch に既存のタグを渡す。
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: '公開し直す release のタグ (例: v0.1.5)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: target
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag could not be determined."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $TAG (version ${TAG#v})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Update gradle.properties
        run: |
          sed -i "s/^pluginVersion = .*/pluginVersion = ${{ steps.target.outputs.version }}/" gradle.properties
          grep '^pluginVersion' gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          # release 本文をシェルへ直接展開するとスクリプトインジェクションになるため、
          # gh 経由で取得する。
          MARKDOWN=$(gh release view "$TAG" --json body -q .body)
          # plugin.xml の <change-notes> は HTML として解釈されるため、
          # GitHub が生成した Markdown を HTML に変換する。
          # mode=gfm は hovercard 等の GitHub 固有属性が大量に付くため mode=markdown を使い、
          # 見出しに付与されるアンカー装飾と class 属性を取り除いて素の HTML にする。
          NOTES=$(gh api /markdown -f text="$MARKDOWN" -f mode=markdown \
            | sed -E 's|<div class="markdown-heading"><h([1-6])[^>]*>(.*)</h[1-6]><a id="user-content-[^"]*"[^>]*>.*</a></div>|<h\1>\2</h\1>|g')
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # change notes が確定しているため、ビルドは 1 回で足りる。
      - name: Build plugin
        run: ./gradlew buildPlugin
        env:
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}

      - name: Verify artifact
        id: artifact
        run: |
          ZIP="build/distributions/intellij-plugin-eof-mark-${{ steps.target.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected artifact not found: $ZIP"
            ls -la build/distributions/ || true
            exit 1
          fi
          echo "artifact=$ZIP" >> "$GITHUB_OUTPUT"

      # main への push と公開より前に実行する。失敗しても副作用が残らないようにするため。
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          # 公開のみをやり直す場合は既にコミット済みなので、差分が無ければ何もしない。
          if git diff --cached --quiet; then
            echo "gradle.properties is already up to date."
          else
            git commit -m "Bump version to ${{ steps.target.outputs.version }}"
            git push origin main
          fi

      - name: Attach artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            "${{ steps.artifact.outputs.artifact }}" --clobber

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}
