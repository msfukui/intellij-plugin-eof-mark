name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get latest release tag
        id: latest_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            TAG_DATE=$(git log -1 --format=%cI "$TAG")
            echo "tag_date=$TAG_DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect merged PRs since last release
        id: collect_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.latest_tag.outputs.tag_date }}" ]; then
            SINCE="${{ steps.latest_tag.outputs.tag_date }}"
            PRS=$(gh pr list --state merged --base main --limit 200 --json number,labels,mergedAt | \
              jq --arg since "$SINCE" '[.[] | select((.mergedAt | fromdateiso8601) > ($since | fromdateiso8601))]')
          else
            PRS=$(gh pr list --state merged --base main --limit 200 --json number,labels,mergedAt)
          fi
          echo "prs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PRS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine version bump level
        id: bump_level
        run: |
          PRS='${{ steps.collect_prs.outputs.prs }}'
          HAS_MAJOR=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:major")')
          HAS_MINOR=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:minor")')
          HAS_PATCH=$(echo "$PRS" | jq '[.[].labels[].name] | any(. == "release:patch")')

          if [ "$HAS_MAJOR" = "true" ]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_MINOR" = "true" ]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_PATCH" = "true" ]; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No PRs with release:major, release:minor, or release:patch labels found since last release."
            exit 1
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT=$(grep '^pluginVersion' gradle.properties | sed 's/.*= *//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          LEVEL="${{ steps.bump_level.outputs.level }}"

          if [ "$LEVEL" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$LEVEL" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION (bump: $LEVEL, from: $CURRENT)"

      - name: Update gradle.properties
        run: |
          sed -i "s/^pluginVersion = .*/pluginVersion = ${{ steps.new_version.outputs.version }}/" gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify artifact
        run: |
          ZIP="build/distributions/intellij-plugin-eof-mark-${{ steps.new_version.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected artifact not found: $ZIP"
            ls -la build/distributions/ || true
            exit 1
          fi
          echo "artifact=$ZIP" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump version to ${{ steps.new_version.outputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          TAG="v${{ steps.new_version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.new_version.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${{ steps.artifact.outputs.artifact }}"

      - name: Get release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.new_version.outputs.version }}"
          MARKDOWN=$(gh release view "$TAG" --json body -q .body)
          # plugin.xml の <change-notes> は HTML として解釈されるため、
          # GitHub が生成した Markdown を HTML に変換する。
          # mode=gfm は hovercard 等の GitHub 固有属性が大量に付くため mode=markdown を使い、
          # 見出しに付与されるアンカー装飾のみ取り除く。
          NOTES=$(gh api /markdown -f text="$MARKDOWN" -f mode=markdown \
            | sed -E 's|<div class="markdown-heading">(<h[1-6][^>]*>.*</h[1-6]>)<a id="user-content-[^"]*"[^>]*>.*</a></div>|\1|g')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Rebuild plugin with change notes
        run: ./gradlew clean buildPlugin
        env:
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PLUGIN_CHANGE_NOTES: ${{ steps.release_notes.outputs.notes }}
