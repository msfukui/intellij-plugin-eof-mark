name: Workflow Audit

# GitHub Actions 関連設定のセキュリティ検査。仕組みが無いとワークフローを追加する
# たびに同じ指摘が積み上がるため、変更時に必ず走らせる。
#
# 検査対象はワークフローだけでなく dependabot.yml も含む（zizmor は .github/ 配下を
# まとめて監査する）ため、paths は .github/** とする。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # SARIF を Code Scanning へ送るには security-events: write が必要になる。
          # 権限を絞る方針を優先し、ジョブの成否のみで判断する。
          advanced-security: false
