name: Release Label Check

on:
  pull_request:
    branches: [ main ]
    types: [opened, labeled, unlabeled, synchronize]

# ラベルの読み取りしか行わないため、既定の権限を与えない。
permissions: {}

jobs:
  check-label:
    runs-on: ubuntu-latest

    steps:
      - name: Check for release label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const releaseLabels = ['release:major', 'release:minor', 'release:patch'];
            const hasReleaseLabel = labels.some(l => releaseLabels.includes(l));

            if (!hasReleaseLabel) {
              core.setFailed(
                'PR には release:major, release:minor, release:patch のいずれかのラベルを付与してください。'
              );
            } else {
              const found = labels.filter(l => releaseLabels.includes(l));
              core.info(`Release label: ${found.join(', ')}`);
            }
