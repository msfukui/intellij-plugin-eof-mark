pluginGroup = com.github.msfukui.intellijplugineofmark
pluginName = EOF Mark
pluginVersion = 0.1.6

platformType = IC
platformVersion = 2024.2

kotlin.stdlib.default.dependency = false

# verifyPlugin は複数の IDE のクラスパスを読み込むため、Gradle のデフォルト値
# （最大ヒープ 512 MiB / 最大メタスペース 384 MiB）ではメタスペースが枯渇し、
# デーモンがビルドごとに再起動する。
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=1g
